name: deelapp
description: Huishoudelijke toestellen delen en verhuren.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0

  # Google Maps & Locatie
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.0
  geocoding: ^3.0.0

  # Afbeeldingen
  image_picker: ^1.1.2

  # State management & navigatie
  provider: ^6.1.2
  go_router: ^14.3.0

  # Datum & utils
  intl: ^0.19.0
  uuid: ^4.5.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/